<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <!-- four folded squares that point inward, forming a diamond -->
    <pattern id="tile" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fff"/>
      <polygon points="0,50 50,0 50,50" fill="#1d5bff"/>
      <polygon points="50,0 100,50 50,50" fill="#8aa9ff"/>
      <polygon points="50,50 100,50 50,100" fill="#1d5bff"/>
      <polygon points="0,50 50,50 50,100" fill="#8aa9ff"/>
      <path d="M0 0H100V100M50 0V100M0 50H100" fill="none" stroke="#dfe4eb" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#tile)"/>
</svg>
